<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Maskable: Android crops this to whatever shape the device uses, so the
       mark sits inside the safe zone at 72% and the background runs corner to
       corner. Same rings as icon.svg and src/components/Logo.tsx. -->
  <defs>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6BF0"/><stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#9F67FA"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="#0D0D1A"/>
  <g transform="translate(24 24) scale(0.72) translate(-24 -24)" fill="none" stroke-linecap="round">
    <circle cx="24" cy="24" r="17" stroke="url(#o)" stroke-width="3.1" pathLength="100" stroke-dasharray="73 27" transform="rotate(-108 24 24)"/>
    <circle cx="24" cy="24" r="11.4" stroke="url(#m)" stroke-width="3" pathLength="100" stroke-dasharray="78 22" transform="rotate(72 24 24)"/>
    <circle cx="24" cy="24" r="6.2" stroke="#CFC2FE" stroke-width="2.6" pathLength="100" stroke-dasharray="66 34" transform="rotate(-116 24 24)"/>
    <circle cx="24" cy="24" r="3.1" fill="#EDEBFF" stroke="none"/>
  </g>
</svg>
